[package]
name = "gravitygolf"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
openssl = { version = "0.10", features = [ "vendored" ] }
tokio-openssl = "0.6"
# Keep your existing dependencies
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }